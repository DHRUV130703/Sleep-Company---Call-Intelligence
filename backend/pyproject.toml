[project]
name = "limezip-backend"
version = "0.1.0"
description = "LimeZip Call Intelligence — API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "phonenumbers>=8.13",
    "rapidfuzz>=3.9",
    "python-multipart>=0.0.9",
    "xlrd>=2.0",
    "mlx-whisper>=0.4.3",
    "faster-whisper>=1.2.1",
    "python-docx>=1.2.0",
    "sqlalchemy-cockroachdb>=2.0",
    "psycopg[binary]>=3.2",
    "certifi>=2026.7.22",
    "fpdf2>=2.8",
    "uharfbuzz>=0.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is handled by `ruff format`; long strings are fine

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection style (`session = Depends(get_session)`) is intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Body", "fastapi.Header"]
